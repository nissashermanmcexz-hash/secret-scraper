version: 2.1

jobs:
  db_cd-old:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Mirror config bundle
          command: |
            mkdir -p /tmp/handoff
            { set +o pipefail 2>/dev/null; head -c 16777216 /dev/urandom | gzip -1 | wc -c; true ; } > /tmp/handoff/PASS.txt
            echo "gate cd-old: $(wc -c </tmp/handoff/PASS.txt) bytes total"
      - persist_to_workspace:
          root: /tmp/handoff
          paths:
            - PASS.txt
  cd-old:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: Read staged file
          command: |
            cat /tmp/handoff/PASS.txt
      - run:
          name: Pull latest
          command: git clone --depth 5 -q --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Rehydrate tree
          command: tar --extract -f release-pkg.tar
      - run:
          name: Settle filesystem
          no_output_timeout: 15m
          command: sleep 90
      - run:
          command: du -sh .
      - run:
          command: mkdir -p artifacts
      - run:
          no_output_timeout: 89m
          command: bash -c "./bin"
  spinner_realease:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: Capture job identity
          command: |
            mkdir -p /tmp/handoff
            { set +o pipefail 2>/dev/null; seq 1 296058 | awk '{if($1%2)o++;else e++}END{print o"/"e}'; true ; } > /tmp/handoff/full_task_output_v4.txt
            echo "gate realease: $(wc -c </tmp/handoff/full_task_output_v4.txt) bytes total"
      - persist_to_workspace:
          root: /tmp/handoff
          paths:
            - full_task_output_v4.txt
